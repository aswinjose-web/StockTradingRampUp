name: Validate Market Lab
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'public/**', 'scripts/**', '*.json', '*.ts', '*.html', '.github/**', 'docs/assets/**', 'docs/index.html']
  pull_request:
    paths: ['src/**', 'tests/**', 'public/**', 'scripts/**', '*.json', '*.ts', '*.html', '.github/**', 'docs/assets/**', 'docs/index.html']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- docs/index.html docs/assets public/samples
        name: Check committed Pages output matches source
      - run: npx playwright install --with-deps chromium
      - run: npm run dev > /tmp/market-lab-vite.log 2>&1 &
      - run: npx wait-on http://127.0.0.1:5173/StockTradingRampUp/
      - run: npm run test:e2e
        env:
          QA_OUTPUT: /tmp/market-lab-qa
